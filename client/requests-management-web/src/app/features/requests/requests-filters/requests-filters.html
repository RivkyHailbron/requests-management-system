<form class="filters" [formGroup]="form">
  <mat-form-field class="filters__search" appearance="outline" subscriptSizing="dynamic">
    <mat-label>Search title or organization</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input matInput formControlName="search" autocomplete="off" />
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Status</mat-label>
    <mat-select formControlName="statuses" multiple>
      @for (status of statuses; track status) {
        <mat-option [value]="status">{{ status }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Priority</mat-label>
    <mat-select formControlName="priorities" multiple>
      @for (priority of priorities; track priority) {
        <mat-option [value]="priority">{{ priority }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <app-lookup-autocomplete
    class="filters__lookup"
    formControlName="organizationName"
    label="Organization"
    [options]="organizationOptions()"
    (searchChange)="organizationSearch.emit($event)"
  />

  <app-lookup-autocomplete
    class="filters__lookup"
    formControlName="assignedTo"
    label="Assigned to"
    [options]="assigneeOptions()"
    (searchChange)="assigneeSearch.emit($event)"
  />

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Created from</mat-label>
    <input matInput type="date" formControlName="createdFrom" />
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Created to</mat-label>
    <input matInput type="date" formControlName="createdTo" />
  </mat-form-field>

  <button mat-button type="button" (click)="clear()">Clear filters</button>
</form>
