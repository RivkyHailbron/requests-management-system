<div class="table-container">
  <table
    mat-table
    [dataSource]="requests()"
    matSort
    [matSortActive]="sortBy()"
    [matSortDirection]="sortDirection() === 'Asc' ? 'asc' : 'desc'"
    matSortDisableClear
    (matSortChange)="onSortChange($event)"
  >
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox
          [checked]="allSelected()"
          [indeterminate]="someSelected()"
          (change)="toggleAll()"
          aria-label="Select all requests on this page"
        />
      </th>
      <td mat-cell *matCellDef="let request">
        <mat-checkbox
          [checked]="selectedIds().has(request.id)"
          (change)="toggle(request)"
          [attr.aria-label]="'Select request ' + request.id"
        />
      </td>
    </ng-container>

    <ng-container matColumnDef="Id">
      <th mat-header-cell *matHeaderCellDef>#</th>
      <td mat-cell *matCellDef="let request">{{ request.id }}</td>
    </ng-container>

    <ng-container matColumnDef="Title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
      <td mat-cell *matCellDef="let request">{{ request.title }}</td>
    </ng-container>

    <ng-container matColumnDef="OrganizationName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Organization</th>
      <td mat-cell *matCellDef="let request">{{ request.organizationName }}</td>
    </ng-container>

    <ng-container matColumnDef="Status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let request">
        <span class="badge" [attr.data-status]="request.status">{{ request.status }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="Priority">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Priority</th>
      <td mat-cell *matCellDef="let request">
        <span class="badge" [attr.data-priority]="request.priority">{{ request.priority }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="AssignedTo">
      <th mat-header-cell *matHeaderCellDef>Assigned to</th>
      <td mat-cell *matCellDef="let request">{{ request.assignedTo ?? '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="CreatedAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
      <td mat-cell *matCellDef="let request">{{ request.createdAt | date: 'short' }}</td>
    </ng-container>

    <ng-container matColumnDef="UpdatedAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Updated</th>
      <td mat-cell *matCellDef="let request">{{ request.updatedAt | date: 'short' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let request" class="actions">
        <button mat-icon-button type="button" matTooltip="Change status" (click)="statusChangeRequested.emit(request)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button type="button" matTooltip="Status history" (click)="historyRequested.emit(request)">
          <mat-icon>history</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>
