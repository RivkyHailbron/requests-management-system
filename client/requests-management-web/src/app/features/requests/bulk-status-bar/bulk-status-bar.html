<div class="bulk-bar" role="region" aria-label="Bulk status update">
  <span class="bulk-bar__count">{{ selectedCount() }} selected</span>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Move to status</mat-label>
    <mat-select [formControl]="statusControl">
      @for (status of statuses; track status) {
        <mat-option [value]="status">{{ status | statusLabel }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button
    mat-flat-button
    type="button"
    [disabled]="statusControl.invalid || busy() || selectedCount() > maxItems()"
    (click)="submit()"
  >
    Apply to selected
  </button>
  <button mat-button type="button" (click)="clearSelection.emit()">Clear selection</button>

  @if (selectedCount() > maxItems()) {
    <span class="bulk-bar__limit">Up to {{ maxItems() }} requests per bulk update.</span>
  }
</div>
