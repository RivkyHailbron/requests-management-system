name: requests-management

x-database-connection: &database-connection
  ConnectionStrings__RequestsDb: Server=sqlserver,1433;Database=RequestsManagement;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: requests-management-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env}
    ports:
      - "${SQL_SERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  seeder:
    build:
      context: .
      dockerfile: tools/RequestsManagement.Seeder/Dockerfile
    container_name: requests-management-seeder
    environment:
      <<: *database-connection
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/RequestsManagement.Api/Dockerfile
    container_name: requests-management-api
    environment:
      <<: *database-connection
      ASPNETCORE_HTTP_PORTS: "8080"
      OpenApi__Enabled: "true"
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      seeder:
        condition: service_completed_successfully

  web:
    build:
      context: client/requests-management-web
    container_name: requests-management-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
